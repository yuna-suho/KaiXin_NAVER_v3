{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'accounts/css/loading_splash.css' %}">
<div class="login-loading-splash{% if not show_loading_splash %} is-hidden{% else %} is-progress-active{% endif %}" id="loginLoadingSplash" role="status" aria-live="polite" aria-busy="true"{% if show_loading_splash %} style="--ll-progress-duration: {{ loading_delay_ms }}ms;"{% endif %}>
    <div class="ll-progress" aria-hidden="true">
        <div class="ll-progress-bar"></div>
    </div>
    <span class="ll-blind">{% if language == 'en' %}Loading{% else %}로딩 중{% endif %}</span>
</div>
